name: Export NeoForge reference source

on:
  push:
    branches:
      - 1.21.1-NeoForge

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Clone NeoForge BuildCraft reference
        run: git clone --depth 1 https://github.com/legoj15/BuildCraft.git reference
      - name: Package reference
        run: tar -C reference --exclude=.git -czf "${RUNNER_TEMP}/BuildCraft-NeoForge-reference.tar.gz" .
      - name: Upload reference
        uses: actions/upload-artifact@v4
        with:
          name: BuildCraft-NeoForge-reference
          path: ${{ runner.temp }}/BuildCraft-NeoForge-reference.tar.gz
          if-no-files-found: error
          retention-days: 1
